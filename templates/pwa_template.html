<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="密码保险箱">
<meta name="theme-color" content="#F2F2F7">
<title>密码保险箱</title>
<style>
/* ===== CSS Reset & Design Tokens ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --ios-blue: #007AFF; --ios-blue-dark: #0056D6;
  --ios-green: #34C759; --ios-red: #FF3B30; --ios-orange: #FF9500;
  --ios-gray: #8E8E93; --ios-gray2: #AEAEB2; --ios-gray3: #C7C7CC; --ios-gray4: #D1D1D6; --ios-gray5: #E5E5EA; --ios-gray6: #F2F2F7;
  --ios-bg: #F2F2F7; --ios-card: #FFFFFF; --ios-label: #000000; --ios-sec-label: #8E8E93;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "Courier New", monospace;
}
html, body { width:100%; height:100%; overflow:hidden; background:var(--ios-bg); font-family:var(--font); color:var(--ios-label); -webkit-font-smoothing:antialiased; }
#app { width:100%; height:100%; position:relative; overflow:hidden; overscroll-behavior-x:none; }

/* ===== Animations ===== */
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideInRight { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
@keyframes slideOutRight { from { opacity:1; transform:translateX(0); } to { opacity:1; transform:translateX(100%); } }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,20px); } to { opacity:1; transform:translate(-50%,0); } }
@keyframes toastOut { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,20px); } }
.anim-fade { animation:fadeIn .35s cubic-bezier(.32,.72,.6,1); }
.anim-slide-in { animation:slideInRight .3s cubic-bezier(.32,.72,.6,1); }

/* ===== Screen Container ===== */
.screen {
  position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden;
  transition:transform .25s cubic-bezier(.32,.72,.6,1);
  background:var(--ios-bg);
}
.screen.hidden { display:none; }
.screen-content { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }

/* 底层状态：上一页可见，但被推至底层并缩小 */
.screen.behind {
  z-index:1;
  transform:translateX(-33%) scale(0.95);
  transition:none;
}

/* 当前显示状态 */
.screen.active {
  z-index:50;
  transform:translateX(0) scale(1);
}

/* 被推出状态（侧滑交互中） */
.screen.popped {
  z-index:60;
  transition:none;
}

/* 前景页左边缘阴影 —— 宽度 20px，峰值不透明度 0.6 */
.screen.popped::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:20px;
  background:linear-gradient(to right, rgba(0,0,0,0.6), transparent);
  z-index:100; pointer-events:none;
  opacity:var(--shadow-opacity, 0);
  transition:none;
}

/* 前后页之间的黑色蒙层 */
.nav-overlay {
  position:absolute; inset:0;
  background:rgba(0,0,0,0.3);
  z-index:15;
  pointer-events:none;
  opacity:0;
  transition:none;
}

/* ===== Navigation Bar ===== */
.nav-bar { flex-shrink:0; display:flex; align-items:center; justify-content:center; height:44px; padding:0 16px; position:relative; background:var(--ios-card); border-bottom:0.5px solid var(--ios-gray4); z-index:10; }
.nav-bar.translucent { background:rgba(255,255,255,.85); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); }
.nav-bar .nav-back { position:absolute; left:0; top:0; bottom:0; display:flex; align-items:center; color:var(--ios-blue); font-size:17px; font-weight:400; cursor:pointer; background:none; border:none; padding:0 12px; font-family:inherit; -webkit-touch-callout:none; }
.nav-bar .nav-back::before { content:""; display:inline-block; width:10px; height:10px; border-left:2.5px solid var(--ios-blue); border-bottom:2.5px solid var(--ios-blue); transform:rotate(45deg); margin-right:2px; }
.nav-bar .nav-title { font-size:17px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
.nav-bar .nav-action { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--ios-blue); font-size:17px; background:none; border:none; font-family:inherit; cursor:pointer; }

/* ===== Search Bar ===== */
.search-bar { flex-shrink:0; padding:8px 16px; background:var(--ios-card); border-bottom:0.5px solid var(--ios-gray4); }
.search-bar .search-wrap { display:flex; align-items:center; background:var(--ios-gray6); border-radius:10px; padding:7px 10px; }
.search-bar .search-wrap svg { width:16px; height:16px; color:var(--ios-gray); flex-shrink:0; margin-right:6px; }
.search-bar input { flex:1; border:none; background:transparent; font-size:17px; font-family:inherit; outline:none; color:var(--ios-label); }
.search-bar input::placeholder { color:var(--ios-gray); }
.search-bar .search-clear { width:18px; height:18px; border-radius:50%; background:var(--ios-gray3); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; flex-shrink:0; margin-left:6px; }

/* ===== Bottom Tab Bar ===== */
.tab-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-around; height:calc(56px + var(--safe-bottom)); padding-bottom:var(--safe-bottom); background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:0.5px solid var(--ios-gray4); z-index:20; }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:56px; cursor:pointer; background:none; border:none; font-family:inherit; }
.tab-item svg { width:24px; height:24px; color:var(--ios-gray); transition:color .2s; }
.tab-item span { font-size:10px; color:var(--ios-gray); font-weight:500; transition:color .2s; }
.tab-item.active svg, .tab-item.active span { color:var(--ios-blue); }

/* ===== Lock Screen ===== */
.lock-screen { background:linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); justify-content:center; align-items:center; z-index:100; }
.lock-screen .lock-content { width:100%; max-width:320px; padding:24px; text-align:center; }
.lock-screen .lock-icon { width:72px; height:72px; margin:0 auto 24px; background:linear-gradient(135deg, var(--ios-blue) 0%, #5856D6 100%); border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 32px rgba(0,122,255,.3); }
.lock-screen .lock-icon svg { width:36px; height:36px; color:#fff; }
.lock-screen .lock-title { font-size:28px; font-weight:700; color:#fff; margin-bottom:8px; letter-spacing:-0.5px; }
.lock-screen .lock-subtitle { font-size:15px; color:rgba(255,255,255,.6); margin-bottom:32px; }
.lock-screen .lock-input-wrap { position:relative; margin-bottom:16px; }
.lock-screen input[type="password"] { width:100%; height:52px; padding:0 16px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.1); color:#fff; font-size:17px; font-family:inherit; outline:none; transition:border-color .2s; -webkit-appearance:none; }
.lock-screen input[type="password"]::placeholder { color:rgba(255,255,255,.35); }
.lock-screen input[type="password"]:focus { border-color:var(--ios-blue); }
.lock-screen .lock-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:rgba(255,255,255,.5); cursor:pointer; padding:4px; }
.lock-screen .lock-btn { width:100%; height:52px; border-radius:12px; border:none; background:var(--ios-blue); color:#fff; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.lock-screen .lock-btn:active { transform:scale(0.97); opacity:0.9; }
.lock-screen .lock-btn:disabled { opacity:0.5; cursor:not-allowed; }
.lock-screen .lock-btn .spinner { width:20px; height:20px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; display:none; }
.lock-screen .lock-btn.loading .spinner { display:block; }
.lock-screen .lock-btn.loading .btn-text { display:none; }
.lock-screen .lock-info { margin-top:20px; font-size:13px; color:rgba(255,255,255,.35); line-height:1.6; }
.lock-screen .lock-error { color:var(--ios-red); font-size:14px; margin-top:12px; min-height:20px; animation:shake .4s; }
.lock-screen .lock-hint { margin-top:24px; padding:16px; background:rgba(255,255,255,.06); border-radius:12px; border:1px solid rgba(255,255,255,.08); }
.lock-screen .lock-hint-title { font-size:13px; font-weight:600; color:rgba(255,255,255,.5); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.lock-screen .lock-hint-title svg { width:14px; height:14px; }
.lock-screen .lock-hint ul { list-style:none; text-align:left; }
.lock-screen .lock-hint li { font-size:12px; color:rgba(255,255,255,.35); padding:3px 0; padding-left:16px; position:relative; }
.lock-screen .lock-hint li::before { content:"•"; position:absolute; left:4px; color:var(--ios-blue); }

/* ===== Category Grid ===== */
.category-header { padding:16px 16px 8px; }
.category-header h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
.category-header .category-count { font-size:15px; color:var(--ios-gray); margin-top:4px; }
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:8px 16px 16px; }
.cat-card { background:var(--ios-card); border-radius:14px; padding:14px; cursor:pointer; transition:all .15s; box-shadow:0 1px 2px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden; }
.cat-card::after { content:""; position:absolute; top:0; right:0; width:60px; height:60px; background:linear-gradient(135deg, transparent 50%, rgba(0,122,255,.06) 100%); border-radius:0 14px 0 50%; }
.cat-card:active { transform:scale(0.97); }
.cat-card .cat-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:4px; }
.cat-card .cat-name { font-size:15px; font-weight:600; color:var(--ios-label); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cat-card .cat-count { font-size:13px; color:var(--ios-gray); }
.cat-card.cat-all .cat-icon { background:linear-gradient(135deg, var(--ios-blue), #5856D6); color:#fff; }

/* ===== Item List ===== */
.item-list { padding:0 0 16px; }
.item-group { margin-bottom:16px; }
.item-group-header { position:sticky; top:0; z-index:5; background:var(--ios-bg); padding:6px 16px; font-size:13px; font-weight:600; color:var(--ios-gray); text-transform:uppercase; letter-spacing:0.5px; backdrop-filter:blur(10px); }
.item-group-header span { display:inline-block; background:var(--ios-bg); padding:2px 8px; border-radius:6px; }
.item-cell { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--ios-card); border-bottom:0.5px solid var(--ios-gray5); cursor:pointer; transition:background .1s; }
.item-cell:first-child { border-top:0.5px solid var(--ios-gray4); }
.item-cell:last-child { border-bottom:0.5px solid var(--ios-gray4); }
.item-cell:active { background:var(--ios-gray6); }
.item-cell .item-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#fff; flex-shrink:0; }
.item-cell .item-info { flex:1; min-width:0; }
.item-cell .item-title { font-size:16px; font-weight:500; color:var(--ios-label); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-cell .item-subtitle { font-size:13px; color:var(--ios-gray); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-cell .item-meta { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.item-cell .item-badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; }
.item-cell .item-chevron { color:var(--ios-gray3); font-size:18px; margin-left:2px; }

/* ===== Detail Screen ===== */
.detail-header { padding:8px 16px 16px; background:var(--ios-card); border-bottom:0.5px solid var(--ios-gray4); }
.detail-icon { width:64px; height:64px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:#fff; margin:0 auto 12px; box-shadow:0 4px 16px rgba(0,0,0,.1); }
.detail-name { font-size:22px; font-weight:700; text-align:center; }
.detail-cat { font-size:14px; color:var(--ios-gray); text-align:center; margin-top:4px; }

.detail-section { margin:16px; background:var(--ios-card); border-radius:12px; overflow:hidden; }
.detail-row { display:flex; align-items:center; padding:12px 16px; border-bottom:0.5px solid var(--ios-gray5); gap:12px; }
.detail-row:last-child { border-bottom:none; }
.detail-row .row-icon { width:32px; height:32px; border-radius:8px; background:var(--ios-gray6); display:flex; align-items:center; justify-content:center; color:var(--ios-blue); flex-shrink:0; }
.detail-row .row-icon svg { width:16px; height:16px; }
.detail-row .row-content { flex:1; min-width:0; }
.detail-row .row-label { font-size:12px; color:var(--ios-gray); margin-bottom:1px; }
.detail-row .row-value { font-size:16px; color:var(--ios-label); word-break:break-all; font-family:var(--font-mono); }
.detail-row .row-value.password-mask { -webkit-text-security:disc; }
.detail-row .row-action { flex-shrink:0; background:none; border:none; color:var(--ios-blue); padding:6px; cursor:pointer; border-radius:8px; display:flex; align-items:center; }
.detail-row .row-action:active { background:var(--ios-gray6); }
.detail-row .row-action svg { width:20px; height:20px; }

.detail-note { margin:0 16px 16px; padding:12px 16px; background:var(--ios-card); border-radius:12px; }
.detail-note-label { font-size:12px; color:var(--ios-gray); margin-bottom:4px; }
.detail-note-text { font-size:15px; color:var(--ios-label); line-height:1.5; white-space:pre-wrap; word-break:break-word; }

/* ===== Empty State ===== */
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px; text-align:center; }
.empty-state svg { width:56px; height:56px; color:var(--ios-gray3); margin-bottom:16px; }
.empty-state .empty-title { font-size:17px; font-weight:600; color:var(--ios-gray); }
.empty-state .empty-desc { font-size:14px; color:var(--ios-gray2); margin-top:6px; }

/* ===== Toast ===== */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; padding:10px 20px; border-radius:20px; font-size:15px; font-weight:500; z-index:9999; pointer-events:none; animation:toastIn .3s ease; backdrop-filter:blur(10px); }
.toast.out { animation:toastOut .3s ease forwards; }

/* ===== Sub-category Grid ===== */
.subcat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
.subcat-card { background:var(--ios-card); border-radius:14px; padding:14px; cursor:pointer; transition:all .15s; box-shadow:0 1px 2px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden; }
.subcat-card:active { transform:scale(0.97); }
.subcat-card .subcat-icon { width:36px; height:36px; border-radius:10px; background:var(--ios-gray6); display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:4px; }
.subcat-card .subcat-name { font-size:15px; font-weight:600; color:var(--ios-label); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.subcat-card .subcat-count { font-size:13px; color:var(--ios-gray); }

/* ===== Search Results ===== */
.search-tabs { display:flex; gap:8px; padding:8px 16px; background:var(--ios-card); border-bottom:0.5px solid var(--ios-gray4); }
.search-tab { padding:6px 14px; border-radius:8px; font-size:14px; font-weight:500; border:none; background:var(--ios-gray6); color:var(--ios-gray); cursor:pointer; font-family:inherit; }
.search-tab.active { background:var(--ios-blue); color:#fff; }

/* ===== Scrollbar hide ===== */
.screen-content::-webkit-scrollbar { display:none; }

/* ===== Responsive ===== */
@media(min-width:430px){ .cat-grid, .subcat-grid { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<div id="app">

<!-- ===== LOCK SCREEN ===== -->
<div id="lockScreen" class="screen lock-screen">
  <div class="lock-content anim-fade">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <div class="lock-title">密码保险箱</div>
    <div class="lock-subtitle">输入主密码以解锁</div>
    <div class="lock-input-wrap">
      <input type="password" id="lockInput" placeholder="主密码" autocomplete="off" />
      <button class="lock-toggle" id="togglePwd" title="显示/隐藏">
        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="lock-btn" id="unlockBtn">
      <div class="spinner"></div>
      <span class="btn-text">解锁</span>
    </button>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-info" id="lockInfo"></div>
    <div class="lock-hint">
      <div class="lock-hint-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        安全提示
      </div>
      <ul>
        <li>解密过程完全在本地进行</li>
        <li>密码不会上传到任何服务器</li>
        <li>关闭页面后数据自动清除</li>
        <li>请妥善保管您的主密码</li>
      </ul>
    </div>
  </div>
</div>

<!-- ===== MAIN SCREEN (Categories) ===== -->
<div id="mainScreen" class="screen hidden">
  <div class="nav-bar translucent">
    <span class="nav-title" id="mainTitle">密码库</span>
  </div>
  <div class="search-bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索" readonly />
    </div>
  </div>
  <div class="screen-content" id="mainContent">
    <div class="category-header">
      <h1 id="catHeaderTitle">密码库</h1>
      <div class="category-count" id="catHeaderCount">0 个条目</div>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </div>
  <div class="tab-bar">
    <button class="tab-item active" data-tab="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <span>密码库</span>
    </button>
    <button class="tab-item" data-tab="urls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      <span>网址库</span>
    </button>
  </div>
</div>

<!-- ===== ITEMS LIST SCREEN ===== -->
<div id="itemsScreen" class="screen hidden">
  <div class="nav-bar">
    <button class="nav-back" id="itemsBack">返回</button>
    <span class="nav-title" id="itemsTitle">条目</span>
    <span class="nav-action" id="itemsCount"></span>
  </div>
  <div class="search-bar" id="itemsSearchBar" style="display:none;">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="itemsFilterInput" placeholder="搜索当前分类..." />
      <button class="search-clear" id="itemsFilterClear">&times;</button>
    </div>
  </div>
  <div class="screen-content" id="itemsContent"></div>
</div>

<!-- ===== SUB-CATEGORY SCREEN ===== -->
<div id="subcatScreen" class="screen hidden">

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:ITERATIONS, hash:'SHA-256' }, keyMaterial, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}

async function decryptData(password, encryptedBase64, saltBase64) {
  try {
    const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
    const combined = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
    // Format: [12-byte nonce | ciphertext | 16-byte tag]
    const nonce = combined.slice(0, 12);
    const ciphertext = combined.slice(12);
    const key = await deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt({ name:'AES-GCM', iv:nonce }, key, ciphertext);
    const decoder = new TextDecoder();
    return decoder.decode(decrypted);
  } catch (e) {
    throw new Error('密码错误或数据损坏');
  }
}

function parseCategory(catStr) {
  if(!catStr) return { level1:'其他', level2:'' };
  const parts = catStr.split('>');
  return { level1: parts[0].trim()||'其他', level2: parts[1]?.trim()||'' };
}

function buildCategoryTree(items) {
  const tree = { '全部': { count: items.length, icon: '🔍', subs: {} } };
  items.forEach(item => {
    const cat = parseCategory(item.category);
    if(!tree[cat.level1]) tree[cat.level1] = { count:0, icon:getCategoryIcon(cat.level1), subs:{} };
    tree[cat.level1].count++;
    if(cat.level2) {
      if(!tree[cat.level1].subs[cat.level2]) tree[cat.level1].subs[cat.level2] = { count:0, icon:getCategoryIcon(cat.level2) };
      tree[cat.level1].subs[cat.level2].count++;
    }
  });
  return tree;
}

function getCurrentCategoryOrders() {
  return currentVault === 'accounts' ? vault.account_category_orders : vault.url_category_orders;
}

function sortCategoriesByOrder(cats, orders) {
  return cats.sort((a, b) => {
    const oa = orders[a] !== undefined ? orders[a] : Infinity;
    const ob = orders[b] !== undefined ? orders[b] : Infinity;
    if (oa !== ob) return oa - ob;
    return a.localeCompare(b, 'zh-CN');
  });
}

// ===== SCREEN NAVIGATION =====
function pushScreen(screenId, builder) {
  const currentVisible = $('.screen.active');
  const currentId = currentVisible?.id;

  // 1. 记录当前页的滚动位置（语义变更：存的是"被覆盖的旧页面"）
  const scrollTop = currentVisible?.querySelector('.screen-content')?.scrollTop || 0;
  if(currentId) {
    navStack.push({ screen: currentId, scroll: scrollTop });
  }

  // 2. 当前页下沉为 behind（保持可见，但偏移+缩小）
  if(currentVisible) {
    currentVisible.classList.remove('active');
    currentVisible.classList.add('behind');
  }

  // 3. 新页置为 active（先禁用 CSS transition，避免 class 切换时触发 transform 动画）
  const newScreen = $('#' + screenId);
  newScreen.style.transition = 'none';
  newScreen.classList.remove('hidden', 'behind');
  newScreen.classList.add('active');

  // 4. 强制 Safari 创建合成层 + 同步重排
  //    双重保险：backface-visibility:hidden（CSS）+ getBoundingClientRect（JS 强制布局）
  void newScreen.getBoundingClientRect();

  // 5. 恢复 CSS transition（此时 transform 已稳定，不会误触动画）
  requestAnimationFrame(() => {
    newScreen.style.transition = '';
  });

  // 6. 清理：hidden 掉不在 navStack 中的 behind screen
  //    保留所有导航栈中记录的页面，确保多层返回时侧滑能看到正确的背景页
  const keepScreens = new Set(navStack.map(n => n.screen));
  if(currentId) keepScreens.add(currentId);
  $all('.screen.behind').forEach(s => {
    if(!keepScreens.has(s.id)) {
      s.classList.remove('behind', 'active');
      s.classList.add('hidden');
    }
  });

  if(builder) builder();
  const sc = newScreen.querySelector('.screen-content');
  if(sc) sc.scrollTop = 0;
}

function popScreen() {
  const currentScreen = $('.screen.active') || $('.screen.popped');
  const popped = navStack.pop();

  // 无导航栈时回到主屏幕（兜底）
  if(!popped) {
    if(currentScreen) {
      currentScreen.classList.remove('active', 'behind');
      currentScreen.classList.add('hidden');
    }
    $all('.screen').forEach(s => s.classList.remove('active','behind','popped'));
    show('mainScreen');
    const main = $('#mainScreen');
    if(main) main.classList.add('active');
    return;
  }

  const prevScreen = $('#' + popped.screen);

  // 1. 当前页彻底隐藏
  if(currentScreen) {
    currentScreen.classList.remove('active', 'behind', 'popped');
    currentScreen.classList.add('hidden');
    currentScreen.style.transform = '';
    currentScreen.style.transition = '';
    currentScreen.style.setProperty('--shadow-opacity', '0');
  }

  // 清理所有导航栏内联样式（防止侧滑残留的 opacity/transition）
  $all('.screen .nav-bar').forEach(nb => {
    nb.style.opacity = '';
    nb.style.transition = '';
  });

  // 2. 上一页从 behind 恢复为 active
  if(prevScreen) {
    // 先禁用 CSS transition，避免 class 切换时 transform 变化触发意外动画
    prevScreen.style.transition = 'none';
    prevScreen.classList.remove('behind', 'hidden', 'popped');
    prevScreen.classList.add('active');
    prevScreen.style.transform = '';
    prevScreen.style.transition = '';
    // 恢复滚动位置
    setTimeout(() => {
      const sc = prevScreen.querySelector('.screen-content');
      if(sc) sc.scrollTop = popped.scroll;
    }, 10);
  }
}

  $('#togglePwd').addEventListener('click', () => {
    const inp = $('#lockInput');
    const isPwd = inp.type === 'password';
    inp.type = isPwd ? 'text' : 'password';
  });
}

async function doUnlock() {
  const pwd = $('#lockInput').value.trim();
  const btn = $('#unlockBtn');
  const err = $('#lockError');
  if(!pwd) { err.textContent = '请输入主密码'; return; }
  btn.classList.add('loading'); btn.disabled = true; err.textContent = '';

  try {
    const jsonStr = await decryptData(pwd, ENCRYPTED_DATA, SALT_BASE64);
    const payload = JSON.parse(jsonStr);
    vault.accounts = payload.accounts || [];
    vault.urls = payload.urls || [];
    vault.account_category_orders = payload.account_category_orders || {};
    vault.url_category_orders = payload.url_category_orders || {};
    vault.decrypted = true;
    $('#lockInput').value = '';
    hide('lockScreen');
    show('mainScreen');
    $('#mainScreen').classList.add('active');
    renderMainScreen();
  } catch(e) {
    err.textContent = e.message || '密码错误，请重试';
    $('#lockInput').value = '';
    $('#lockInput').focus();
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

// ===== RENDER: Main Screen (Category Grid) =====
function renderMainScreen() {
  const items = currentVault === 'accounts' ? vault.accounts : vault.urls;
  const tree = buildCategoryTree(items);

  $('#mainTitle').textContent = currentVault === 'accounts' ? '密码库' : '网址库';
  $('#catHeaderTitle').textContent = currentVault === 'accounts' ? '密码库' : '网址库';
  $('#catHeaderCount').textContent = `${items.length} 个${currentVault === 'accounts' ? '账号' : '网址'}`;

  // Update tab bar
  $all('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === currentVault));

  const grid = $('#catGrid');
  grid.innerHTML = '';

  // "All" card
  const allCard = document.createElement('div');
  allCard.className = 'cat-card cat-all';
  allCard.innerHTML = `<div class="cat-icon">${getCategoryIcon('全部')}</div><div class="cat-name">全部</div><div class="cat-count">${items.length} 个</div>`;
  allCard.addEventListener('click', () => openItemsList('全部', items));
  grid.appendChild(allCard);

  // Level-1 categories (sort by software category order)
  const orders = getCurrentCategoryOrders();
  sortCategoriesByOrder(Object.keys(tree).filter(k => k !== '全部'), orders).forEach(cat => {
    const info = tree[cat];
    const hasSubs = Object.keys(info.subs).length > 0;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.setProperty('--cat-accent', generateIconColor(cat));
    card.innerHTML = `<div class="cat-icon" style="background:${generateIconColor(cat)}20;color:${generateIconColor(cat)};">${info.icon}</div><div class="cat-name">${cat}</div><div class="cat-count">${info.count} 个</div>`;
    card.addEventListener('click', () => {
      if(hasSubs) {
        openSubCategories(cat, info.subs, items);
      } else {
        openItemsList(cat, items.filter(i => parseCategory(i.category).level1 === cat));
      }
    });
    grid.appendChild(card);
  });
}

// ===== RENDER: Sub-Category Screen =====
function openSubCategories(parentCat, subs, allItems) {
  pushScreen('subcatScreen', () => {
    $('#subcatTitle').textContent = parentCat;
    const content = $('#subcatContent');
    content.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'subcat-grid anim-fade';

    // "All in this category" card
    const allCard = document.createElement('div');
    allCard.className = 'subcat-card';
    const parentCount = allItems.filter(i => parseCategory(i.category).level1 === parentCat).length;
    allCard.innerHTML = `<div class="subcat-icon" style="background:${generateIconColor(parentCat)}20;color:${generateIconColor(parentCat)};">${getCategoryIcon(parentCat)}</div><div class="subcat-name">全部</div><div class="subcat-count">${parentCount} 个</div>`;
    allCard.addEventListener('click', () => openItemsList(parentCat, allItems.filter(i => parseCategory(i.category).level1 === parentCat)));
    grid.appendChild(allCard);

    const subOrders = getCurrentCategoryOrders();
    sortCategoriesByOrder(Object.keys(subs), subOrders).forEach(sub => {
      const info = subs[sub];
      const card = document.createElement('div');
      card.className = 'subcat-card';
      card.innerHTML = `<div class="subcat-icon" style="background:${generateIconColor(sub)}20;color:${generateIconColor(sub)};">${info.icon}</div><div class="subcat-name">${sub}</div><div class="subcat-count">${info.count} 个</div>`;
      card.addEventListener('click', () => {
        const subItems = allItems.filter(i => {
          const c = parseCategory(i.category);
          return c.level1 === parentCat && c.level2 === sub;
        });
        openItemsList(`${parentCat} > ${sub}`, subItems);
      });
      grid.appendChild(card);
    });

    content.appendChild(grid);
  });
}

// ===== RENDER: Items List Screen =====
function openItemsList(title, items) {
  pushScreen('itemsScreen', () => {
    $('#itemsTitle').textContent = title;
    $('#itemsCount').textContent = `${items.length} 个`;
    $('#itemsSearchBar').style.display = '';
    renderItemsList(items);
  });
}

function renderItemsList(items, containerId = 'itemsContent') {
  const container = $(`#${containerId}`);
  container.innerHTML = '';

  if(items.length === 0) {
    container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg><div class="empty-title">暂无数据</div><div class="empty-desc">该分类下没有条目</div></div>`;
    return;
  }

  const isAccount = currentVault === 'accounts' || (items.length > 0 && items[0].app_name !== undefined);

  // Sort using precomputed _alpha_key / _sort_key (same logic as main_window.py)
  const sorted = [...items].sort((a, b) => {
    const ga = (a._alpha_key || '#') === '#' ? 1 : 0;
    const gb = (b._alpha_key || '#') === '#' ? 1 : 0;
    if (ga !== gb) return ga - gb;
    const sa = (a._sort_key || '').toLowerCase();
    const sb = (b._sort_key || '').toLowerCase();
    return sa.localeCompare(sb, 'zh-CN');
  });

  // Group by _alpha_key
  const groups = {};
  sorted.forEach(item => {
    const key = item._alpha_key || '#';
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
  });

  // Sort keys: A-Z first, # last
  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (a === '#') return 1;
    if (b === '#') return -1;
    return a.localeCompare(b);
  });

  sortedKeys.forEach(letter => {
    const header = document.createElement('div');
    header.className = 'item-group-header';
    header.innerHTML = `<span>${letter}</span>`;
    container.appendChild(header);

    const group = document.createElement('div');
    group.className = 'item-group';
    groups[letter].forEach(item => {
      const cell = createItemCell(item, isAccount);
      group.appendChild(cell);
    });
    container.appendChild(group);
  });
}

function createItemCell(item, isAccount) {
  const cell = document.createElement('div');
  cell.className = 'item-cell';
  const name = isAccount ? (item.app_name || '未命名') : (item.title || '未命名');
  let subtitle = isAccount ? maskUsername(item.username || '') : (item.url || '');
  // 如果有备注或AI备注，优先显示在副标题中
  const note = item.ai_remark || item.remark || '';
  if(note) {
    subtitle = subtitle ? (subtitle + ' · ' + note) : note;
  }
  const color = generateIconColor(name);
  const initial = getInitial(name);
  const cat = item.category || '其他';
  const catShort = cat.split('>').pop().trim();

  let badges = '';
  if(item.security_level) {
    const colors = { '弱':'#FF3B30','中':'#FF9500','强':'#34C759','极强':'#007AFF' };
    const c = colors[item.security_level] || '#8E8E93';
    badges += `<span class="item-badge" style="background:${c}18;color:${c};">${item.security_level}</span>`;
  }

  cell.innerHTML = `
    <div class="item-icon" style="background:${color};">${initial}</div>
    <div class="item-info">
      <div class="item-title">${name}</div>
      <div class="item-subtitle">${subtitle}</div>
    </div>
    <div class="item-meta">
      <span class="item-badge" style="background:var(--ios-gray6);color:var(--ios-gray);">${catShort}</span>
      ${badges}
      <span class="item-chevron">›</span>
    </div>
  `;
  cell.addEventListener('click', () => openDetail(item, isAccount));
  return cell;
}

function maskUsername(username) {
  if(!username) return '';
  if(username.length <= 4) return username.charAt(0) + '***';
  return username.substring(0, 2) + '***' + username.substring(username.length - 2);
}

// ===== RENDER: Detail Screen =====
function openDetail(item, isAccount) {
  pushScreen('detailScreen', () => {
    const container = $('#detailContent');
    const name = isAccount ? (item.app_name || '未命名') : (item.title || '未命名');
    const color = generateIconColor(name);
    const initial = getInitial(name);
    const cat = item.category || '其他';

    let rows = '';
    if(isAccount) {
      rows += makeDetailRow('user', '用户名', item.username || '-', true);
      rows += makeDetailRow('key', '密码', item.password || '-', true, true);
    } else {
      // 网址库也支持保存密码
      if(item.password) rows += makeDetailRow('key', '密码', item.password, true, true);
    }
    if(item.url) rows += makeDetailRow('link', '网址', item.url, true);
    rows += makeDetailRow('tag', '分类', cat, false);
    if(item.tags) rows += makeDetailRow('hash', '标签', typeof item.tags === 'string' ? item.tags : JSON.stringify(item.tags), false);

    let securityBadge = '';
    if(item.security_level) {
      const sc = { '弱':'#FF3B30','中':'#FF9500','强':'#34C759','极强':'#007AFF' };
      const c = sc[item.security_level] || '#8E8E93';
      securityBadge = `<span class="item-badge" style="background:${c}18;color:${c};font-size:13px;padding:4px 12px;">安全等级：${item.security_level}</span>`;

    }

    container.innerHTML = `

  });

    user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',

    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',

  };
  const valueClass = isPassword ? 'row-value password-mask' : 'row-value';

function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function escapeJs(t){ return (t||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\n/g,'\\n').replace(/\r/g,''); }

function copyText(btn, text) {
  navigator.clipboard?.writeText(text).then(() => toast('已复制'))
    .catch(() => { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制'); });
}

function togglePassword(btn) {
  const valEl = btn.parentElement.querySelector('.row-value');
  valEl.classList.toggle('password-mask');
  btn.style.color = valEl.classList.contains('password-mask') ? 'var(--ios-blue)' : 'var(--ios-green)';
}

function initSearch() {
  // Main screen search tap -> open search screen
  $('#searchInput').addEventListener('focus', () => {
    $('#searchInput').blur();
    pushScreen('searchScreen', () => {
      $('#searchRealInput').value = '';
      setTimeout(() => $('#searchRealInput').focus(), 100);
      renderSearchResults('');
    });
  });

  // Real-time search
  let searchDebounce;
  $('#searchRealInput').addEventListener('input', e => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => renderSearchResults(e.target.value.trim()), 150);
  });

  // Search tabs
  $all('#searchTabs .search-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $all('#searchTabs .search-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      searchScope = tab.dataset.scope;
      renderSearchResults($('#searchRealInput').value.trim());
    });
  });

  $('#searchClear').addEventListener('click', () => { $('#searchRealInput').value=''; renderSearchResults(''); $('#searchRealInput').focus(); });
  $('#searchBack').addEventListener('click', popScreen);
}

function renderSearchResults(query) {
  const container = $('#searchContent');
  container.innerHTML = '';

  let items = [];
  if(searchScope === 'all' || searchScope === 'accounts') items = items.concat(vault.accounts.map(i => ({...i, _type:'account'})));
  if(searchScope === 'all' || searchScope === 'urls') items = items.concat(vault.urls.map(i => ({...i, _type:'url'})));

  if(!query) {
    container.innerHTML = `<div class="empty-state" style="padding-top:80px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><div class="empty-title">输入关键词搜索</div><div class="empty-desc">搜索应用名、用户名、网址等</div></div>`;
    return;
  }

  const q = query.toLowerCase();
  const filtered = items.filter(i => {
    const name = (i.app_name || i.title || '').toLowerCase();
    const user = (i.username || '').toLowerCase();
    const url = (i.url || '').toLowerCase();
    const cat = (i.category || '').toLowerCase();
    return name.includes(q) || user.includes(q) || url.includes(q) || cat.includes(q);
  });

  if(filtered.length === 0) {
    container.innerHTML = `<div class="empty-state" style="padding-top:60px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8"/><path d="M16 8l-8 8"/></svg><div class="empty-title">未找到结果</div><div class="empty-desc">换个关键词试试</div></div>`;
    return;
  }

  // Sort search results using _alpha_key / _sort_key
  filtered.sort((a, b) => {
    const ga = (a._alpha_key || '#') === '#' ? 1 : 0;
    const gb = (b._alpha_key || '#') === '#' ? 1 : 0;
    if (ga !== gb) return ga - gb;
    const sa = (a._sort_key || '').toLowerCase();
    const sb = (b._sort_key || '').toLowerCase();
    return sa.localeCompare(sb, 'zh-CN');
  });

  const list = document.createElement('div');
  list.className = 'item-list';
  filtered.forEach(item => {
    const isAccount = item._type === 'account';
    const cell = createItemCell(item, isAccount);
    list.appendChild(cell);
  });
  container.appendChild(list);
}

function initItemsFilter() {

  $('#itemsFilterInput').addEventListener('input', e => {

    debounce = setTimeout(() => {

// ===== SWIPE BACK GESTURE =====
function initSwipeBack() {
  // ===== 常量配置 =====
  const EDGE_WIDTH = 20;              // 触发区域：屏幕左边缘 0~20pt
  const ACTIVATE_DX = 8;              // 水平激活阈值：> 8pt
  const ACTIVATE_DY_RATIO = 0.5;      // 垂直阈值：dy <= dx * 0.5
  const COMPLETE_RATIO = 0.5;         // 完成阈值：>= 50% 屏宽
  const COMPLETE_VELOCITY = 300;      // 快速滑动阈值：>= 300 pt/s
  const ANIM_DURATION_COMPLETE = 250; // 完成动画时长 ms
  const ANIM_DURATION_CANCEL = 300;   // 取消动画时长 ms
  const VELOCITY_WINDOW_MS = 150;     // 速度采样窗口：最近 150ms

  // ===== 状态机变量 =====
  let state = 'idle'; // idle | monitoring | activated | dragging | completing | cancelling
  let startX = 0, startY = 0;
  let currentX = 0, currentY = 0;
  let activeScreen = null;   // 前景页（当前 .active）
  let prevScreen = null;     // 背景页（.behind）
  let prevNavBar = null;     // 背景页导航栏
  let activeNavBar = null;   // 前景页导航栏
  let navOverlay = null;     // 黑色蒙层元素
  let screenWidth = 0;
  let isReducedMotion = false;

  // ===== 速度采样追踪（滑动窗口） =====
  let moveHistory = [];        // {x, y, time} 最近滑动样本
  let fastSwipeQualified = false; // 是否满足快速滑动条件

  // ===== 深层 behind screen 暂存 =====
  let suppressedScreens = [];  // 侧滑期间被 hidden 的非直接前页 behind screen

  function getScreenWidth() {
    return window.innerWidth || document.documentElement.clientWidth;
  }

  function ensureNavOverlay() {
    if(!navOverlay) {
      navOverlay = document.createElement('div');
      navOverlay.className = 'nav-overlay';
      $('#app').appendChild(navOverlay);
    }
    return navOverlay;
  }

  function removeNavOverlay() {
    if(navOverlay && navOverlay.parentNode) {
      navOverlay.parentNode.removeChild(navOverlay);
      navOverlay = null;
    }
  }

  function resetStyles() {
    if(activeScreen) {
      activeScreen.style.transform = '';
      activeScreen.style.transition = '';
      activeScreen.style.setProperty('--shadow-opacity', '0');
      activeScreen.classList.remove('popped');
      if(!activeScreen.classList.contains('hidden')) {
        activeScreen.classList.add('active');
      }
    }
    if(prevScreen) {
      prevScreen.style.transform = '';
      prevScreen.style.transition = '';
    }
    if(prevNavBar) { prevNavBar.style.opacity = ''; prevNavBar.style.transition = ''; }
    if(activeNavBar) { activeNavBar.style.opacity = ''; activeNavBar.style.transition = ''; }
    if(navOverlay) { navOverlay.style.opacity = ''; }
    removeNavOverlay();
    // 恢复被隐藏的深层 behind screen（推迟到下一帧，避免与归位动画竞争）
    const toRestore = suppressedScreens;
    suppressedScreens = [];
    requestAnimationFrame(() => {
      toRestore.forEach(s => {
        s.classList.add('behind');
        s.classList.remove('hidden');
      });
    });
  }

  // 计算滑动窗口内的平均速度
  function computeWindowedVelocity() {
    if(moveHistory.length < 2) return 0;
    const first = moveHistory[0];
    const last = moveHistory[moveHistory.length - 1];
    const dt = last.time - first.time;
    if(dt < 10) return 0; // 最少 10ms 间隔，避免除零噪声
    return Math.abs((last.x - first.x) / dt) * 1000; // pt/s
  }

  // 检测快速滑动资格（速度 + 方向）
  function checkFastSwipeQualification() {
    const totalDx = currentX - startX;
    const totalDy = currentY - startY;
    // 整体以水平为主：垂直位移不超过水平位移的 50%
    const mostlyHorizontal = totalDx > 0 && Math.abs(totalDy) <= Math.abs(totalDx) * ACTIVATE_DY_RATIO;
    const velocity = computeWindowedVelocity();
    fastSwipeQualified = (velocity >= COMPLETE_VELOCITY) && mostlyHorizontal;
  }

  // ===== Touch Start =====
  document.addEventListener('touchstart', e => {
    isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    screenWidth = getScreenWidth();

    if(navStack.length === 0) return;

    activeScreen = $('.screen.active');
    if(!activeScreen) return;
    if(activeScreen.id === 'mainScreen' || activeScreen.id === 'lockScreen') return;

    const touch = e.touches[0];
    if(touch.clientX > EDGE_WIDTH) return;

    state = 'monitoring';
    startX = touch.clientX;
    startY = touch.clientY;
    currentX = startX;
    currentY = startY;

    // 重置速度采样
    moveHistory = [];
    moveHistory.push({ x: startX, y: startY, time: performance.now() });
    fastSwipeQualified = false;

    const prevInfo = navStack[navStack.length - 1];
    prevScreen = prevInfo ? $('#' + prevInfo.screen) : null;
    prevNavBar = prevScreen?.querySelector('.nav-bar');
    activeNavBar = activeScreen?.querySelector('.nav-bar');

    if(prevNavBar) {
      prevNavBar.style.transition = 'none';
      prevNavBar.style.opacity = '0';
    }
  }, { passive:true });

  // ===== Touch Move =====
  document.addEventListener('touchmove', e => {
    if(state === 'idle') return;

    const touch = e.touches[0];
    currentX = touch.clientX;
    currentY = touch.clientY;
    const dx = currentX - startX;
    const dy = currentY - startY;

    // 记录滑动样本（滑动窗口）
    const now = performance.now();
    moveHistory.push({ x: currentX, y: currentY, time: now });
    const cutoff = now - VELOCITY_WINDOW_MS;
    while(moveHistory.length > 2 && moveHistory[0].time < cutoff) {
      moveHistory.shift();
    }

    if(state === 'monitoring') {
      if(dx < 0) { state = 'idle'; resetStyles(); return; }
      if(Math.abs(dy) > Math.abs(dx) * ACTIVATE_DY_RATIO) { state = 'idle'; resetStyles(); return; }
      if(dx > ACTIVATE_DX) {
        state = 'activated';
        activeScreen.classList.remove('active');
        activeScreen.classList.add('popped');
        ensureNavOverlay();

        // 侧滑开始时：hidden 所有非 prevScreen 的 behind screen
        // 确保拖动时只显示 active + prev 两层，避免露出深层页面 + 减少合成压力
        suppressedScreens = [];
        $all('.screen.behind').forEach(s => {
          if(s !== prevScreen) {
            s.classList.add('hidden');
            s.classList.remove('behind');
            suppressedScreens.push(s);
          }
        });
      } else {
        return;
      }
    }

    if(state !== 'activated' && state !== 'dragging') return;
    state = 'dragging';

    if(dx < 0) return;

    const progress = Math.min(dx / screenWidth, 1);

    // 1. 前景页：1:1 跟随手指
    activeScreen.style.transform = `translateX(${dx}px)`;

    // 2. 前景页阴影：随位移递增，峰值 0.6
    const shadowOpacity = Math.min(dx / (screenWidth * 0.5), 0.6);
    activeScreen.style.setProperty('--shadow-opacity', String(shadowOpacity));

    // 3. 背景页：从 -1/3 屏宽跟随，缩放 0.95 -> 1.0
    if(prevScreen) {
      const prevTranslate = -screenWidth / 3 + dx / 3;
      const prevScale = 0.95 + progress * 0.05;
      prevScreen.style.transform = `translateX(${prevTranslate}px) scale(${prevScale})`;
    }

    // 4. 黑色蒙层：随位移递减
    if(navOverlay) {
      navOverlay.style.opacity = String(Math.max(0.3 - progress, 0));
    }

    // 5. 导航栏转场
    const navProgress = Math.min(dx / (screenWidth * 0.5), 1);
    if(activeNavBar) {
      activeNavBar.style.opacity = String(Math.max(1 - navProgress, 0));
    }
    if(prevNavBar) {
      prevNavBar.style.opacity = String(Math.min(navProgress, 1));
    }

    // 6. 实时更新快速滑动资格（在拖动过程中持续评估）
    checkFastSwipeQualification();
  }, { passive:true });

  // ===== Touch End =====
  document.addEventListener('touchend', () => {
    if(state !== 'dragging' && state !== 'activated') {
      if(state !== 'idle') { state = 'idle'; resetStyles(); }
      return;
    }

    const totalDx = currentX - startX;
    const totalDy = currentY - startY;

    // 计算滑动窗口平均速度
    const velocity = computeWindowedVelocity();

    // 最终垂直条件检查：整体以水平为主
    const mostlyHorizontal = totalDx > 0 && Math.abs(totalDy) <= Math.abs(totalDx) * ACTIVATE_DY_RATIO;

    // 快速滑动判定：速度达标 且 方向正确
    const isFastSwipe = fastSwipeQualified && mostlyHorizontal && velocity >= COMPLETE_VELOCITY;

    // 完成判定：位移 >= 50% 屏宽  或  快速滑动
    // 快速滑动优先级高于位移判定——满足即直接返回
    const shouldComplete = totalDx >= screenWidth * COMPLETE_RATIO || isFastSwipe;

    if(shouldComplete) {
      state = 'completing';
      const duration = isReducedMotion ? 0 : ANIM_DURATION_COMPLETE;

      if(activeScreen) {
        activeScreen.style.transition = `transform ${duration}ms ease-out`;
        activeScreen.style.transform = `translateX(${screenWidth}px)`;
      }
      if(prevScreen) {
        prevScreen.style.transition = `transform ${duration}ms ease-out`;
        prevScreen.style.transform = 'translateX(0) scale(1)';
      }
      if(navOverlay) {
        navOverlay.style.transition = `opacity ${duration}ms ease-out`;
        navOverlay.style.opacity = '0';
      }

      setTimeout(() => {
        popScreen();
        resetStyles();
        state = 'idle';
      }, duration);
    } else {
      state = 'cancelling';
      const duration = isReducedMotion ? 0 : ANIM_DURATION_CANCEL;

      if(activeScreen) {
        activeScreen.style.transition = `transform ${duration}ms cubic-bezier(0.34, 1.56, 0.64, 1)`;
        activeScreen.style.transform = 'translateX(0)';
      }
      if(prevScreen) {
        prevScreen.style.transition = `transform ${duration}ms cubic-bezier(0.34, 1.56, 0.64, 1)`;
        prevScreen.style.transform = 'translateX(-33%) scale(0.95)';
      }
      if(navOverlay) {
        navOverlay.style.transition = `opacity ${duration}ms ease-out`;
        navOverlay.style.opacity = '0.3';
      }
      if(activeNavBar) {
        activeNavBar.style.transition = `opacity ${duration}ms ease-out`;
        activeNavBar.style.opacity = '1';
      }
      if(prevNavBar) {
        prevNavBar.style.transition = `opacity ${duration}ms ease-out`;
        prevNavBar.style.opacity = '0';
      }

      setTimeout(() => {
        resetStyles();
        state = 'idle';
      }, duration);
    }
  }, { passive:true });

  // ===== Touch Cancel =====
  document.addEventListener('touchcancel', () => {
    if(state !== 'idle') {
      state = 'idle';
      resetStyles();
    }
  }, { passive:true });
}

// ===== NAVIGATION BINDINGS =====
function initNav() {
  // Tab switching
  $all('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
      currentVault = tab.dataset.tab;
      renderMainScreen();
      navStack = [];
    });
  });

  // Back buttons
  $('#itemsBack').addEventListener('click', popScreen);
  $('#subcatBack').addEventListener('click', popScreen);
  $('#detailBack').addEventListener('click', popScreen);

  // Override items list render to store current items for filtering
  const origOpenItems = openItemsList;
  openItemsList = function(title, items) {
    pushScreen('itemsScreen', () => {
      $('#itemsTitle').textContent = title;
      $('#itemsCount').textContent = `${items.length} 个`;
      $('#itemsSearchBar').style.display = '';
      $('#itemsScreen')._currentItems = items;
      $('#itemsFilterInput').value = '';
      renderItemsList(items);
    });
  };
}

// ===== INITIALIZATION =====
function init() {
  initLockScreen();
  initSearch();
  initItemsFilter();
  initNav();
  initSwipeBack();
}

// Wait for fonts and DOM
document.addEventListener('DOMContentLoaded', init);
</script>
